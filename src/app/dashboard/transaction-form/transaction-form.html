<form (ngSubmit)="onSubmit()" class="transaction-form">
  <!-- SELETTORE TIPO TRANSAZIONE -->
  <div class="type-selector">
    <label class="type-option" [class.active]="tipo === 'expense'">
      <input type="radio" name="tipo" value="expense" [(ngModel)]="tipo" />
      <span>Uscita</span>
    </label>
    <label class="type-option" [class.active]="tipo === 'income'">
      <input type="radio" name="tipo" value="income" [(ngModel)]="tipo" />
      <span>Entrata</span>
    </label>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label>Titolo</label>
      <input
        type="text"
        placeholder="Es. Supermercato"
        [(ngModel)]="titolo"
        name="titolo"
        required
      />
    </div>

    <div class="form-group">
      <label>Importo (€)</label>
      <input
        type="number"
        step="0.01"
        placeholder="0.00"
        [(ngModel)]="importo"
        name="importo"
        required
      />
    </div>

    <div class="form-group">
      <label>Categoria</label>
      <input
        type="text"
        placeholder="Es. Alimentari"
        [(ngModel)]="categoria"
        name="categoria"
        required
      />
    </div>

    <div class="form-group">
      <label>Data</label>
      <input type="date" [(ngModel)]="data" name="data" required />
    </div>
  </div>

  <div class="form-checkbox">
    <input type="checkbox" id="ricorrente" [(ngModel)]="isRicorrente" name="isRicorrente" />
    <label for="ricorrente">Spesa fissa / ricorrente</label>
  </div>

  <button type="submit" class="btn-submit">Aggiungi transazione</button>
</form>
