<form (ngSubmit)="onSubmit()">
  <div class="type-selector">
    <label> <input type="radio" name="tipo" value="expense" [(ngModel)]="tipo" /> Uscita </label>
    <label> <input type="radio" name="tipo" value="income" [(ngModel)]="tipo" /> Entrata </label>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label>Titolo</label>
      <input
        type="text"
        placeholder="Es. Spesa al supermercato"
        [(ngModel)]="titolo"
        name="titolo"
        required
      />
    </div>

    <div class="form-group">
      <label>Importo (€)</label>
      <input
        type="number"
        step="0.01"
        placeholder="0.00"
        [(ngModel)]="importo"
        name="importo"
        required
      />
    </div>

    <div class="form-group">
      <label>Categoria</label>
      <input
        type="text"
        placeholder="Es. Alimentari"
        [(ngModel)]="categoria"
        name="categoria"
        required
      />
    </div>

    <div class="form-group">
      <label>Data</label>
      <input type="date" [(ngModel)]="data" name="data" required />
    </div>
  </div>

  <div class="form-checkbox">
    <input type="checkbox" id="ricorrente" [(ngModel)]="isRicorrente" name="isRicorrente" />
    <label for="ricorrente">Spesa fissa / ricorrente</label>
  </div>

  <button type="submit">Aggiungi transazione</button>
</form>
